  </g>
  <g id="text_25">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="233.28" transform="rotate(-0 69.12 233.28)">Native Java speedup over our readable Python reference</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="645.12" y="233.28" transform="rotate(-0 645.12 233.28)">Same OS measurement for both processes</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183044" x="69.12" y="495.72" transform="rotate(-0 69.12 495.72)">Counted UMIs: Python 991,809  |  Java 993,032. Outputs differ because anchor matching differs.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="524.88" transform="rotate(-0 69.12 524.88)">Both implementations were authored for this project. This is not a benchmark of biotech-lab software or clinical accuracy.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="551.448" transform="rotate(-0 69.12 551.448)">Intel Core i7-12700  ·  RHEL 9.6  ·  CPython 3.11.16  ·  Oracle GraalVM 25.0.3  ·  one CPU  ·  2026-11-13</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="578.016" transform="rotate(-0 69.12 578.016)">Medians of 3 fresh processes; whiskers show min–max. Timing includes startup, imports and I/O. Allocation tracing is disabled.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="601.992" transform="rotate(-0 69.12 601.992)">Filesystem cache was not flushed. Peak RSS includes the runtime; not Java heap use. 30.8 GiB system RAM. Raw results and methods accompany this chart.</text>
  </g>
