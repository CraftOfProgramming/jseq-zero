  <g id="text_23">
   <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087f8c" x="69.12" y="204.768" transform="rotate(-0 69.12 204.768)">30.5× faster</text>
  </g>
  <g id="text_24">
