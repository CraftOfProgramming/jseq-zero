  <g id="text_21">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526174" x="69.12" y="167.184" transform="rotate(-0 69.12 167.184)">ELAPSED TIME</text>
